        function attachCalendarCellDropHandlers(cell) {
            cell.addEventListener("dragover", (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                cell.classList.add("drag-over");
            });

            cell.addEventListener("dragleave", (e) => {
                if (!cell.contains(e.relatedTarget)) cell.classList.remove("drag-over");
            });

            cell.addEventListener("drop", (e) => {
                e.preventDefault();
                cell.classList.remove("drag-over");

                const taskId = e.dataTransfer.getData("text/plain") || draggedId;
                if (!taskId) return;

                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                const targetDateKey = cell.dataset.dateKey;
                if (!targetDateKey) return;

                let hours = 18, minutes = 0;
                if (task.dueDate) {
                    const prev = new Date(task.dueDate);
                    if (!isNaN(prev.getTime())) {
                        hours = prev.getHours();
                        minutes = prev.getMinutes();
                    }
                }

                const [year, month, day] = targetDateKey.split("-").map(Number);
                const newDueDate = new Date(year, month - 1, day, hours, minutes, 0, 0);

                task.dueDate = newDueDate.toISOString();
                task.updatedAt = new Date().toISOString();

                calSelectedDateKey = targetDateKey;
                saveTasks();
                renderTasks();
                showToast(`Tenggat diubah ke ${newDueDate.toLocaleDateString("id-ID", { day: "numeric", month: "short" })}`);
            });
        }

        // Menghitung dan merender susunan tanggal kalender bulanan
        function renderCalendar() {
            const monthNames = [
                "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI",
                "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
            ];
            calendarMonthYear.innerHTML = `
                <span class="cal-month-name">${monthNames[calCurrentMonth]}</span>
                <span class="cal-year-num">${calCurrentYear}</span>
            `;

            calendarDaysGrid.replaceChildren();

            const firstDayIndex = new Date(calCurrentYear, calCurrentMonth, 1).getDay();
            const daysInMonth = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();
            const prevMonthDays = new Date(calCurrentYear, calCurrentMonth, 0).getDate();

            const today = new Date();
            const todayKey = getDateKey(today);
            if (!calSelectedDateKey) calSelectedDateKey = todayKey;

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const prevDate = new Date(calCurrentYear, calCurrentMonth - 1, dayNum);
                const dateKey = getDateKey(prevDate);
                calendarDaysGrid.appendChild(createDayCell(dayNum, dateKey, true, dateKey === todayKey, dateKey === calSelectedDateKey));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const curDate = new Date(calCurrentYear, calCurrentMonth, day);
                const dateKey = getDateKey(curDate);
                calendarDaysGrid.appendChild(createDayCell(day, dateKey, false, dateKey === todayKey, dateKey === calSelectedDateKey));
            }

            const totalCells = firstDayIndex + daysInMonth;
            const remainingCells = totalCells <= 35 ? (35 - totalCells) : (42 - totalCells);
            for (let day = 1; day <= remainingCells; day++) {
                const nextDate = new Date(calCurrentYear, calCurrentMonth + 1, day);
                const dateKey = getDateKey(nextDate);
                calendarDaysGrid.appendChild(createDayCell(day, dateKey, true, dateKey === todayKey, dateKey === calSelectedDateKey));
            }

            renderAgenda();
        }

        function createDayCell(dayNumber, dateKey, isOtherMonth, isToday, isSelected) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "cal-day-cell" +
                (isOtherMonth ? " other-month" : "") +
                (isToday ? " is-today" : "") +
                (isSelected ? " is-selected" : "");
            cell.dataset.dateKey = dateKey;

            const daySpan = document.createElement("span");
            daySpan.textContent = dayNumber;
            cell.appendChild(daySpan);

            const dateTasks = getTasksForDate(dateKey);
            if (dateTasks.length > 0) {
                const dotsWrap = document.createElement("div");
                dotsWrap.className = "cal-day-dots";

                const maxDots = Math.min(dateTasks.length, 3);
                for (let i = 0; i < maxDots; i++) {
                    const dot = document.createElement("span");
                    const p = dateTasks[i].priority || "medium";
                    dot.className = `cal-dot p-${p}`;
                    dotsWrap.appendChild(dot);
                }
                cell.appendChild(dotsWrap);
            }

            cell.addEventListener("click", () => {
                calSelectedDateKey = dateKey;
                calendarDaysGrid.querySelectorAll(".cal-day-cell").forEach(c => c.classList.remove("is-selected"));
                cell.classList.add("is-selected");
                renderAgenda();
            });

            attachCalendarCellDropHandlers(cell);
            return cell;
        }

                editBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

                delBtn.dataset.action = "agenda-delete";
                delBtn.dataset.id = task.id;
                delBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

                actions.append(editBtn, delBtn);
                right.appendChild(actions);

                item.append(left, right);
                agendaTaskList.appendChild(item);
            });
        }

        agendaTaskList.addEventListener("change", (e) => {
            const cb = e.target;
            if (!(cb instanceof HTMLInputElement) || cb.dataset.action !== "agenda-toggle") return;
            const task = tasks.find(t => t.id === cb.dataset.id);
            if (!task) return;
            task.completed = cb.checked;
            saveTasks();
            renderTasks();
            if (task.completed) showToast(`Selesai: "${task.title}"`);
        });

        agendaTaskList.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const taskId = btn.dataset.id;
            const action = btn.dataset.action;

            if (action === "agenda-edit") openEditModal(taskId);
            else if (action === "agenda-delete") {
                const idx = tasks.findIndex(t => t.id === taskId);
                if (idx !== -1) {
                    lastDeletedTask = tasks[idx];
                    lastDeletedIndex = idx;
                    tasks.splice(idx, 1);
                    saveTasks();
                    renderTasks();
                    showToast(`Tugas dihapus`, true);
                }
            }
        });

        calPrevBtn.addEventListener("click", () => {
            calCurrentMonth--;
            if (calCurrentMonth < 0) { calCurrentMonth = 11; calCurrentYear--; }
            renderCalendar();
        });

        calNextBtn.addEventListener("click", () => {
            calCurrentMonth++;
            if (calCurrentMonth > 11) { calCurrentMonth = 0; calCurrentYear++; }
            renderCalendar();
        });

        calTodayBtn.addEventListener("click", () => {
            const now = new Date();
            calCurrentYear = now.getFullYear();
            calCurrentMonth = now.getMonth();
            calSelectedDateKey = getDateKey(now);
            renderCalendar();
        });

        
        async function initializeApp() {
            try {
                await openStashDB();
                const preferences = await loadPreferences();
                if (!preferences.theme) {
                    await savePreference("theme", document.documentElement.getAttribute("data-theme"));
                }
                await loadTasks();
            } catch (error) {
                console.error("Gagal membuka database lokal:", error);
                storageNotice.textContent = "Penyimpanan lokal tidak tersedia di browser ini.";
                tasks = [];
                renderTasks();
            }
        }

        window.addEventListener("keydown", (e) => {
            if (editModal.open) {
                if (e.key === "Escape") editModal.close();
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    e.preventDefault();
                    editForm.requestSubmit();
                }
                return;
            }

            if (e.key === "/" && document.activeElement !== taskInput && document.activeElement !== taskSearchInput) {
                e.preventDefault();
                taskSearchInput.focus();
                return;
            }

            if ((e.key === "n" || e.key === "N") && document.activeElement !== taskInput && document.activeElement !== taskSearchInput) {
                e.preventDefault();
                taskInput.focus();
                return;
            }

            if (e.key === "Escape") {
                if (document.activeElement === taskSearchInput) {
                    if (taskSearchInput.value) {
                        taskSearchInput.value = "";
                        searchQuery = "";
                        searchClearBtn.hidden = true;
                        renderTasks();
                    }
                    taskSearchInput.blur();
                } else if (document.activeElement === taskInput || taskForm.classList.contains("is-expanded")) {
                    taskInput.value = "";
                    collapseTaskForm(true);
                }
            }
        });

        
        initTheme();
        initializeApp();
    </script>
</body>
</html>
