    <script>
        // =====================================
        // 1. PENGATURAN AWAL & THEME
        // =====================================
        const STORAGE_KEY = "todo-list-v1";
        const THEME_KEY = "todo-list-theme";
        const VIEW_KEY = "todo-list-view";

        const taskForm = document.getElementById("task-form");
        const taskInput = document.getElementById("task-input");
        const taskDueInput = document.getElementById("task-due-input");
        const taskList = document.getElementById("task-list");
        const tasksTableWrapper = document.getElementById("tasks-table-wrapper");
        const tasksTableBody = document.getElementById("tasks-table-body");
        const taskSummary = document.getElementById("task-summary");
        const filterSelect = document.getElementById("filter-select");
        const emptyState = document.getElementById("empty-state");
        const clearCompletedButton = document.getElementById("clear-completed");
        const clearAllButton = document.getElementById("clear-all");
        const storageNotice = document.getElementById("storage-notice");
        const themeToggle = document.getElementById("theme-toggle");
        const filterButtons = document.querySelectorAll(".filter-btn");
        const viewButtons = document.querySelectorAll(".view-btn");

        let currentView = localStorage.getItem(VIEW_KEY) || "list";

        // Modal Edit Elemen
        const editModal = document.getElementById("edit-modal");
        const editForm = document.getElementById("edit-form");
        const editTaskId = document.getElementById("edit-task-id");
        const editTaskTitle = document.getElementById("edit-task-title");
        const editTaskDue = document.getElementById("edit-task-due");
        const editClearDueBtn = document.getElementById("edit-clear-due-btn");
        const modalCancelBtn = document.getElementById("modal-cancel-btn");
        const modalCloseBtn = document.getElementById("modal-close-btn");
        const modalDeleteBtn = document.getElementById("modal-delete-btn");
        const editCharCounter = document.getElementById("edit-char-counter");
        const editTitleError = document.getElementById("edit-title-error");
        const editTaskCompleted = document.getElementById("edit-task-completed");
        const editMetaInfo = document.getElementById("edit-meta-info");
        const editPresetButtons = document.querySelectorAll(".modal-due-presets .btn-preset");

        // Kalender Elemen
        const calendarMonthYear = document.getElementById("calendar-month-year");
        const calendarDaysGrid = document.getElementById("calendar-days-grid");
        const calTodayBtn = document.getElementById("cal-today-btn");
        const calPrevBtn = document.getElementById("cal-prev-btn");
        const calNextBtn = document.getElementById("cal-next-btn");
        const agendaDateTitle = document.getElementById("agenda-date-title");
        const agendaCountBadge = document.getElementById("agenda-count-badge");
        const agendaTaskList = document.getElementById("agenda-task-list");
        const agendaEmptyState = document.getElementById("agenda-empty-state");

        // Kalender State
        let calCurrentYear = new Date().getFullYear();
        let calCurrentMonth = new Date().getMonth();
        let calSelectedDateKey = null; // diinisialisasi setelah helper getDateKey siap

        // Prioritas State
        let addSelectedPriority = "medium";
        let editSelectedPriority = "medium";

        // Handle Switch Mode Tampilan (Daftar / Tabel)
        viewButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const view = btn.dataset.view;
                if (view === currentView) return;
                currentView = view;
                localStorage.setItem(VIEW_KEY, currentView);
                viewButtons.forEach(b => b.classList.toggle("active", b.dataset.view === currentView));
                renderTasks();
            });
        });
        viewButtons.forEach(b => b.classList.toggle("active", b.dataset.view === currentView));

        // Handle Klik Prioritas pada Form Tambah
        const addPriorityButtons = document.querySelectorAll("#add-priority-group .priority-pill");
        addPriorityButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                addPriorityButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                addSelectedPriority = btn.dataset.priority;
            });
        });

        // Handle Klik Prioritas pada Modal Edit
        const editPriorityButtons = document.querySelectorAll("#edit-priority-group .priority-pill");
        editPriorityButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                editPriorityButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                editSelectedPriority = btn.dataset.priority;
            });
        });

        // Inisialisasi tema
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = savedTheme ? savedTheme === "dark" : systemPrefersDark;
            applyTheme(isDark);
        }

        const SUN_SVG = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
        const MOON_SVG = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute("data-theme", "dark");
                themeToggle.innerHTML = SUN_SVG;
                themeToggle.setAttribute("title", "Ganti ke mode terang");
            } else {
                document.documentElement.removeAttribute("data-theme");
                themeToggle.innerHTML = MOON_SVG;
                themeToggle.setAttribute("title", "Ganti ke mode gelap");
            }
        }

        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            const nextTheme = !isDark;
            applyTheme(nextTheme);
            localStorage.setItem(THEME_KEY, nextTheme ? "dark" : "light");
        });

        initTheme();

        // =====================================
        // 2. DATA TUGAS
        // =====================================
        let tasks = [];

        // =====================================
        // [GARIS PEMBERITAHU: GENERATOR ID UNIK & LOGIKA TENGGAT WAKTU (DUE DATE)]
        // createId: Membuat ID unik berbasis timestamp base36 + random entropy tanpa dependensi UUID eksternal.
        // formatDueDate: Menghitung status deadline secara real-time (Terlambat, Hari ini, Besok, sisa hari)
        // dengan kode warna dan format relatif waktu.
        // =====================================
        // 3. MEMBUAT ID UNIK
        // =====================================
        function createId() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return window.crypto.randomUUID();
            }
            return Date.now() + "-" + Math.random().toString(16).slice(2);
        }

        // Format tanggal & jam dibuat
        function formatCreatedAt(isoString) {
            if (!isoString) return "";
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return "";

                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();

                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);
                const isYesterday = date.toDateString() === yesterday.toDateString();

                const timeStr = date.toLocaleTimeString("id-ID", {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                if (isToday) return `Dibuat: Hari ini · ${timeStr}`;
                if (isYesterday) return `Dibuat: Kemarin · ${timeStr}`;

                const dateStr = date.toLocaleDateString("id-ID", {
                    day: "numeric",
                    month: "short"
                });

                return `Dibuat: ${dateStr} · ${timeStr}`;
            } catch (_) {
                return "";
            }
        }

        // Format tenggat waktu (due date)
        function formatDueDate(isoString) {
            if (!isoString) return null;
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return null;

                const now = new Date();
                const diffMs = date.getTime() - now.getTime();
                const isOverdue = diffMs < 0;

                const isToday = date.toDateString() === now.toDateString();

                const tomorrow = new Date();
                tomorrow.setDate(now.getDate() + 1);
                const isTomorrow = date.toDateString() === tomorrow.toDateString();

                const timeStr = date.toLocaleTimeString("id-ID", {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                let label = "";
                if (isToday) {
                    label = `Hari ini · ${timeStr}`;
                } else if (isTomorrow) {
                    label = `Besok · ${timeStr}`;
                } else {
                    const dateStr = date.toLocaleDateString("id-ID", {
                        day: "numeric",
                        month: "short"
                    });
                    label = `${dateStr} · ${timeStr}`;
                }

                const isDueSoon = !isOverdue && diffMs <= (24 * 60 * 60 * 1000);

                return {
                    label: isOverdue ? `Terlambat · ${label}` : `Tenggat: ${label}`,
                    isOverdue,
                    isDueSoon
                };
            } catch (_) {
                return null;
            }
        }

        // Konversi Date ke input datetime-local value (YYYY-MM-DDTHH:mm)
        function toDatetimeLocalString(isoString) {
            if (!isoString) return "";
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return "";
                const offset = date.getTimezoneOffset() * 60000;
                const localDate = new Date(date.getTime() - offset);
                return localDate.toISOString().slice(0, 16);
            } catch (_) {
                return "";
            }
        }

        // Dapatkan string datetime-local untuk preset cepat
        function getPresetDatetime(preset) {
            const d = new Date();
            if (preset === "today") {
                if (d.getHours() >= 18) {
                    d.setHours(23, 59, 0, 0);
                } else {
                    d.setHours(18, 0, 0, 0);
                }
            } else if (preset === "tomorrow") {
                d.setDate(d.getDate() + 1);
                d.setHours(18, 0, 0, 0);
            } else if (preset === "next-week") {
                d.setDate(d.getDate() + 7);
                d.setHours(18, 0, 0, 0);
            }
            return toDatetimeLocalString(d.toISOString());
        }

        // Ambil string format YYYY-MM-DD lokal
        function getDateKey(d) {
            if (!d) return null;
            try {
                const date = new Date(d);
                if (isNaN(date.getTime())) return null;
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, "0");
                const day = String(date.getDate()).padStart(2, "0");
                return `${year}-${month}-${day}`;
            } catch (_) {
                return null;
            }
        }

        // Set tanggal terpilih kalender awal ke hari ini
        calSelectedDateKey = getDateKey(new Date());

        // Ambil daftar tugas untuk tanggal tertentu
        function getTasksForDate(dateKey) {
            if (!dateKey) return [];
            return tasks.filter(t => {
                if (t.dueDate) {
                    return getDateKey(t.dueDate) === dateKey;
                }
                return getDateKey(t.createdAt) === dateKey;
            });
        }

        // =====================================
        // [GARIS PEMBERITAHU: KONEKSI DATABASE & PENGAMBILAN DATA (GET /api/tasks)]
        // Di sinilah website tersambung ke backend & database (tasks.json).
        // Dilengkapi fallback cerdas: jika server offline/dibuka langsung via file,
        // otomatis beralih ke localStorage browser dan melakukan auto-migrasi saat server aktif.
        // =====================================
        // 4. MENGAMBIL DATA DARI SERVER / STORAGE
        // =====================================
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        // Migrasi dari localStorage jika server masih kosong
                        if (data.length === 0) {
                            const saved = localStorage.getItem(STORAGE_KEY);
                            const localTasks = saved ? JSON.parse(saved) : [];
                            if (Array.isArray(localTasks) && localTasks.length > 0) {
                                tasks = localTasks.map(normalizeTask);
                                await saveTasks();
                                renderTasks();
                                return;
                            }
                        }

                        tasks = data.map(normalizeTask);
                        renderTasks();
                        return;
                    }
                }
            } catch (_) {
                // Backend tidak aktif atau dibuka via file://
            }

            // Fallback ke localStorage
            try {
                const savedTasks = localStorage.getItem(STORAGE_KEY);
                const parsedTasks = savedTasks ? JSON.parse(savedTasks) : [];
                tasks = (Array.isArray(parsedTasks) ? parsedTasks : []).map(normalizeTask);
            } catch (error) {
                console.error("Gagal memuat tugas:", error);
                tasks = [];
            }
            renderTasks();
        }

        function normalizeTask(task) {
            return {
                id: String(task.id || createId()),
                title: String(task.title || ""),
                completed: Boolean(task.completed),
                createdAt: task.createdAt || new Date().toISOString(),
                updatedAt: task.updatedAt || null,
                priority: ["high", "medium", "low"].includes(task.priority) ? task.priority : "medium",
                dueDate: task.dueDate || null
            };
        }

        // =====================================
        // [GARIS PEMBERITAHU: SINKRONISASI DATABASE (POST /api/tasks)]
        // Di sinilah perubahan data tugas dikirim dan disimpan permanen ke database server.
        // Menggunakan strategi Dual-Layer Storage:
        // 1. Backup instan ke localStorage browser
        // 2. Kirim POST request JSON ke server untuk ditulis ke file tasks.json
        // 3. Jika server offline, tampilkan notifikasi penyimpanan offline
        // =====================================
        // 5. MENYIMPAN DATA KE SERVER & BACKUP
        // =====================================
        async function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (_) {}

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tasks)
                });
                if (res.ok) {
                    storageNotice.textContent = "";
                    return;
                }
            } catch (_) {
                storageNotice.textContent = "Data tersimpan di browser (offline / server belum dinyalakan)";
                setTimeout(() => {
                    if (storageNotice.textContent.includes("browser")) {
                        storageNotice.textContent = "";
                    }
                }, 3000);
            }
        }

        // =====================================
        // 6. MENAMBAHKAN TUGAS
        // =====================================
        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const title = taskInput.value.trim();

            if (title === "") {
                return;
            }

            let dueDateIso = null;
            if (taskDueInput.value) {
                const parsedDate = new Date(taskDueInput.value);
                if (!isNaN(parsedDate.getTime())) {
                    dueDateIso = parsedDate.toISOString();
                }
            }

            const newTask = {
                id: String(createId()),
                title: title,
                completed: false,
                createdAt: new Date().toISOString(),
                priority: addSelectedPriority,
                dueDate: dueDateIso
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();

            taskInput.value = "";
            taskDueInput.value = "";
            taskInput.focus();
        });

        // =====================================
        // [GARIS PEMBERITAHU: ENGINE DRAG-AND-DROP (DESKTOP + MOBILE TOUCH)]
        // Fitur interaksi canggih untuk menyusun ulang urutan tugas (reordering):
        // 1. Desktop: Native HTML5 Drag and Drop API
        // 2. Mobile: Touch events (touchstart, touchmove via elementFromPoint, touchend)
        // =====================================
        // 7. DRAG AND DROP HANDLERS
        // =====================================
        let draggedId = null;

        function cleanDragStyles() {
            taskList.querySelectorAll(".task-item").forEach(item => {
                item.classList.remove("drag-over-top", "drag-over-bottom", "is-dragging");
            });
        }

        function reorderTask(fromId, toId, placeBefore) {
            if (!fromId || !toId || fromId === toId) return;

            const fromIndex = tasks.findIndex(t => t.id === fromId);
            if (fromIndex === -1) return;

            const [movedTask] = tasks.splice(fromIndex, 1);
            let toIndex = tasks.findIndex(t => t.id === toId);

            if (toIndex === -1) {
                tasks.push(movedTask);
            } else {
                if (!placeBefore) {
                    toIndex += 1;
                }
                tasks.splice(toIndex, 0, movedTask);
            }

            saveTasks();
            renderTasks();
        }

        // Desktop Drag Over
        taskList.addEventListener("dragover", function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";

            const targetItem = e.target.closest(".task-item");
            if (!targetItem || targetItem.dataset.id === draggedId) {
                return;
            }

            const rect = targetItem.getBoundingClientRect();
            const isAbove = e.clientY < (rect.top + rect.height / 2);

            taskList.querySelectorAll(".task-item").forEach(item => {
                if (item !== targetItem) {
                    item.classList.remove("drag-over-top", "drag-over-bottom");
                }
            });

            targetItem.classList.toggle("drag-over-top", isAbove);
            targetItem.classList.toggle("drag-over-bottom", !isAbove);
        });

        taskList.addEventListener("dragleave", function(e) {
            const targetItem = e.target.closest(".task-item");
            if (targetItem && !targetItem.contains(e.relatedTarget)) {
                targetItem.classList.remove("drag-over-top", "drag-over-bottom");
            }
        });

        taskList.addEventListener("drop", function(e) {
            e.preventDefault();
            const targetItem = e.target.closest(".task-item");
            if (!targetItem || !draggedId || targetItem.dataset.id === draggedId) {
                cleanDragStyles();
                return;
            }

            const targetId = targetItem.dataset.id;
            const rect = targetItem.getBoundingClientRect();
            const isAbove = e.clientY < (rect.top + rect.height / 2);

            reorderTask(draggedId, targetId, isAbove);
            cleanDragStyles();
            draggedId = null;
        });

        // Touch Drag & Drop for Mobile
        let touchDraggedId = null;
        let touchCurrentTarget = null;
        let touchPlaceBefore = true;

        taskList.addEventListener("touchstart", function(e) {
            const handle = e.target.closest(".drag-handle");
            if (!handle) return;

            const item = handle.closest(".task-item");
            if (!item) return;

            touchDraggedId = item.dataset.id;
            item.classList.add("is-dragging");
        }, { passive: true });

        taskList.addEventListener("touchmove", function(e) {
            if (!touchDraggedId) return;

            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetItem = element ? element.closest(".task-item") : null;

            taskList.querySelectorAll(".task-item").forEach(item => {
                item.classList.remove("drag-over-top", "drag-over-bottom");
            });

            if (targetItem && targetItem.dataset.id !== touchDraggedId) {
                const rect = targetItem.getBoundingClientRect();
                touchPlaceBefore = touch.clientY < (rect.top + rect.height / 2);
                targetItem.classList.add(touchPlaceBefore ? "drag-over-top" : "drag-over-bottom");
                touchCurrentTarget = targetItem;
                if (e.cancelable) e.preventDefault();
            } else {
                touchCurrentTarget = null;
            }
        }, { passive: false });

        taskList.addEventListener("touchend", function() {
            if (touchDraggedId && touchCurrentTarget) {
                const toId = touchCurrentTarget.dataset.id;
                reorderTask(touchDraggedId, toId, touchPlaceBefore);
            }
            cleanDragStyles();
            touchDraggedId = null;
            touchCurrentTarget = null;
        });

        taskList.addEventListener("touchcancel", function() {
            cleanDragStyles();
            touchDraggedId = null;
            touchCurrentTarget = null;
        });

        // =====================================
        // [GARIS PEMBERITAHU: RENDERER DAFTAR TUGAS (DUAL-VIEW: CARD LIST & TABLE VIEW)]
        // Merender tugas dalam 2 mode yang bisa diganti pengguna:
        // - View "list": Tampilan kartu responsif dengan drag handle & tombol aksi
        // - View "table": Tampilan tabel data lengkap dengan kolom judul, prioritas, tenggat, & aksi
        // =====================================
        // 8. MENAMPILKAN DAFTAR TUGAS
        // =====================================
        function renderTasks() {
            taskList.replaceChildren();
            tasksTableBody.replaceChildren();
            const filter = filterSelect.value;

            const filteredTasks = tasks.filter(task => {
                if (filter === "active") return !task.completed;
                if (filter === "completed") return task.completed;
                return true;
            });

            const hasTasks = tasks.length > 0;
            const hasFiltered = filteredTasks.length > 0;

            emptyState.hidden = hasFiltered;

            if (!hasTasks) {
                emptyState.textContent = "Belum ada tugas. Tulis sesuatu di atas!";
            } else if (!hasFiltered) {
                emptyState.textContent = "Tidak ada tugas dalam kategori ini.";
            }

            if (currentView === "table") {
                taskList.hidden = true;
                tasksTableWrapper.hidden = !hasFiltered;

                filteredTasks.forEach(task => {
                    const row = document.createElement("tr");
                    row.className = task.completed ? "is-completed" : "";
                    row.dataset.id = task.id;

                    // Checkbox Status
                    const tdStatus = document.createElement("td");
                    tdStatus.className = "td-status";
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "task-checkbox";
                    checkbox.checked = task.completed;
                    checkbox.dataset.action = "toggle";
                    checkbox.dataset.id = task.id;
                    checkbox.setAttribute("aria-label", "Tandai tugas " + task.title);
                    tdStatus.appendChild(checkbox);

                    // Judul Tugas
                    const tdTitle = document.createElement("td");
                    tdTitle.className = "td-title";
                    const titleSpan = document.createElement("span");
                    titleSpan.className = "tasks-table-title";
                    titleSpan.textContent = task.title;
                    titleSpan.title = "Klik dua kali untuk edit tugas";
                    titleSpan.addEventListener("dblclick", function(e) {
                        e.preventDefault();
                        openEditModal(task.id);
                    });
                    tdTitle.appendChild(titleSpan);

                    // Prioritas
                    const tdPriority = document.createElement("td");
                    tdPriority.className = "td-priority";
                    const priorityBadge = document.createElement("span");
                    const priority = task.priority || "medium";
                    priorityBadge.className = `priority-badge priority-${priority}`;
                    const priorityLabels = { high: "Tinggi", medium: "Sedang", low: "Rendah" };
                    priorityBadge.innerHTML = `<span class="priority-dot"></span><span>${priorityLabels[priority] || "Sedang"}</span>`;
                    tdPriority.appendChild(priorityBadge);

                    // Tenggat Waktu
                    const tdDue = document.createElement("td");
                    tdDue.className = "td-due";
                    const dueInfo = formatDueDate(task.dueDate);
                    if (dueInfo) {
                        const dueSpan = document.createElement("span");
                        const isOverdueNotCompleted = dueInfo.isOverdue && !task.completed;
                        const isDueSoonNotCompleted = dueInfo.isDueSoon && !task.completed;
                        dueSpan.className = "task-due" +
                            (isOverdueNotCompleted ? " is-overdue" : "") +
                            (isDueSoonNotCompleted ? " is-due-soon" : "");
                        dueSpan.innerHTML = `
                            <svg class="task-date-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/>
                            </svg>
                            <span>${dueInfo.label}</span>
                        `;
                        tdDue.appendChild(dueSpan);
                    } else {
                        const emptyDue = document.createElement("span");
                        emptyDue.style.color = "var(--text-muted)";
                        emptyDue.textContent = "—";
                        tdDue.appendChild(emptyDue);
                    }

                    // Aksi
                    const tdActions = document.createElement("td");
                    tdActions.className = "td-actions";
                    const actionsWrapper = document.createElement("div");
                    actionsWrapper.className = "task-actions";

                    const editButton = document.createElement("button");
                    editButton.className = "btn-action btn-edit";
                    editButton.type = "button";
                    editButton.dataset.action = "edit";
                    editButton.dataset.id = task.id;
                    editButton.setAttribute("aria-label", "Edit tugas");
                    editButton.setAttribute("title", "Edit tugas (atau klik 2x judul)");
                    editButton.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "btn-action btn-delete";
                    deleteButton.type = "button";
                    deleteButton.dataset.action = "delete";
                    deleteButton.dataset.id = task.id;
                    deleteButton.setAttribute("aria-label", "Hapus tugas");
                    deleteButton.setAttribute("title", "Hapus tugas");
                    deleteButton.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

                    tdActions.appendChild(actionsWrapper);

                    tasksTableBody.appendChild(row);

            } else {
                taskList.hidden = !hasFiltered;
                tasksTableWrapper.hidden = true;

                filteredTasks.forEach(task => {
                const listItem = document.createElement("li");
                listItem.className = "task-item" + (task.completed ? " is-completed" : "");
                listItem.setAttribute("draggable", "true");

                        <circle cx="11" cy="3" r="1.5" />
                        <circle cx="5" cy="8" r="1.5" />
                        <circle cx="11" cy="8" r="1.5" />
                        <circle cx="5" cy="13" r="1.5" />
                        <circle cx="11" cy="13" r="1.5" />

                // Checkbox
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.dataset.action = "toggle";
                checkbox.dataset.id = task.id;
                checkbox.setAttribute("aria-label", "Tandai tugas " + task.title);

                // Label, Teks, Prioritas & Tanggal
                const taskLabel = document.createElement("label");
                taskLabel.className = "task-label";

                const taskContent = document.createElement("div");
                taskContent.className = "task-content";

                taskText.className = "task-text";
                taskText.textContent = task.title;

                const taskMetaRow = document.createElement("div");
                taskMetaRow.className = "task-header-row";

                const priorityBadge = document.createElement("span");
                const priority = task.priority || "medium";
                priorityBadge.className = `priority-badge priority-${priority}`;

                    medium: "Sedang",
                    low: "Rendah"

                priorityBadge.innerHTML = `
                    <span class="priority-dot"></span>
                    <span>${priorityLabels[priority] || "Sedang"}</span>
                `;

                taskMetaRow.appendChild(priorityBadge);

                // Render Due Date jika ada
                const dueInfo = formatDueDate(task.dueDate);
                if (dueInfo) {
                    const dueSpan = document.createElement("span");
                    const isOverdueNotCompleted = dueInfo.isOverdue && !task.completed;
                    const isDueSoonNotCompleted = dueInfo.isDueSoon && !task.completed;

                    dueSpan.className = "task-due" +
                        (isOverdueNotCompleted ? " is-overdue" : "") +
                        (isDueSoonNotCompleted ? " is-due-soon" : "");

                    dueSpan.innerHTML = `
                        <svg class="task-date-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/>
                        </svg>
                        <span>${dueInfo.label}</span>
                    `;
                    taskMetaRow.appendChild(dueSpan);
                }

                // Klik dua kali judul untuk edit cepat
                taskText.title = "Klik dua kali untuk edit tugas";
                taskText.addEventListener("dblclick", function(e) {
                    e.preventDefault();
                    openEditModal(task.id);
                });

                taskContent.append(taskText, taskMetaRow);
                taskLabel.append(checkbox, taskContent);

                // Tombol aksi
                const actionsWrapper = document.createElement("div");
                actionsWrapper.className = "task-actions";

                const editButton = document.createElement("button");
                editButton.className = "btn-action btn-edit";
                editButton.type = "button";
                editButton.dataset.action = "edit";
                editButton.dataset.id = task.id;
                editButton.setAttribute("aria-label", "Edit tugas");
                editButton.setAttribute("title", "Edit tugas (atau klik 2x judul)");
                editButton.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

                const deleteButton = document.createElement("button");
                deleteButton.className = "btn-action btn-delete";
                deleteButton.type = "button";
                deleteButton.dataset.action = "delete";
                deleteButton.dataset.id = task.id;
                deleteButton.setAttribute("aria-label", "Hapus tugas");
                deleteButton.setAttribute("title", "Hapus tugas");
                deleteButton.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

                actionsWrapper.append(editButton, deleteButton);
                listItem.append(dragHandle, taskLabel, actionsWrapper);

                // Desktop Drag Event Listeners
                listItem.addEventListener("dragstart", function(e) {
                    if (e.target.closest("button") || e.target.closest("input")) {
                        e.preventDefault();
                        return;
                    }
                    draggedId = task.id;
                    e.dataTransfer.effectAllowed = "move";
                    e.dataTransfer.setData("text/plain", task.id);
                    setTimeout(() => {
                        listItem.classList.add("is-dragging");
                    }, 0);
                });

                listItem.addEventListener("dragend", function() {
                    cleanDragStyles();
                    draggedId = null;
                });

                taskList.appendChild(listItem);
            });
            }

            updateSummary();
            renderCalendar();

        // =====================================
        // 9. MEMPERBARUI JUMLAH TUGAS
        // =====================================
        function updateSummary() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(task => task.completed).length;
            const activeTasks = totalTasks - completedTasks;

            taskSummary.textContent = `${activeTasks} tugas tersisa · ${completedTasks} selesai`;

            clearCompletedButton.disabled = completedTasks === 0;
            clearAllButton.disabled = totalTasks === 0;
        }

        // =====================================
        // 10. MENANDAI TUGAS SELESAI
        // =====================================
        function handleTaskToggle(event) {
            const checkbox = event.target;
            if (
                !(checkbox instanceof HTMLInputElement) ||
                checkbox.dataset.action !== "toggle"
            ) {
                return;
            }

            const task = tasks.find(item => item.id === checkbox.dataset.id);
            if (!task) return;

            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        }

        taskList.addEventListener("change", handleTaskToggle);
        tasksTableBody.addEventListener("change", handleTaskToggle);

        // =====================================
        // 11. BUKA MODAL EDIT TUGAS & HAPUS
        // =====================================
        function openEditModal(taskId) {
            const task = tasks.find(item => item.id === taskId);
            if (!task) return;

            editTaskId.value = task.id;
            editTaskTitle.value = task.title;
            if (editCharCounter) {
                editCharCounter.textContent = `${task.title.length}/100`;
            }
            editTaskTitle.classList.remove("is-invalid");
            if (editTitleError) {
                editTitleError.hidden = true;
            }

            editTaskDue.value = toDatetimeLocalString(task.dueDate);
            if (editTaskCompleted) {
                editTaskCompleted.checked = Boolean(task.completed);
            }

            // Set pilihan prioritas di modal
            editSelectedPriority = task.priority || "medium";
            editPriorityButtons.forEach(btn => {
                btn.classList.toggle("active", btn.dataset.priority === editSelectedPriority);
            });

            // Format tanggal info riwayat
            if (editMetaInfo) {
                const createdDate = task.createdAt ? new Date(task.createdAt) : null;
                const updatedDate = task.updatedAt ? new Date(task.updatedAt) : null;
                let metaHtml = "";
                if (createdDate && !isNaN(createdDate.getTime())) {
                    metaHtml += `<span><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">calendar_month</span> Dibuat: ${createdDate.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>`;
                }
                if (updatedDate && !isNaN(updatedDate.getTime())) {
                    metaHtml += `<span><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">edit</span> Terakhir diubah: ${updatedDate.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>`;
                }
                editMetaInfo.innerHTML = metaHtml;
                editMetaInfo.style.display = metaHtml ? "flex" : "none";
            }

            editModal.showModal();
            setTimeout(() => {
                editTaskTitle.focus();
                editTaskTitle.select();
            }, 30);
        }

        // Live input character counter & validation reset
        editTaskTitle.addEventListener("input", () => {
            if (editCharCounter) {
                editCharCounter.textContent = `${editTaskTitle.value.length}/100`;
            }
            if (editTaskTitle.value.trim().length > 0) {
                editTaskTitle.classList.remove("is-invalid");
                if (editTitleError) editTitleError.hidden = true;
            }
        });

        // Quick date presets
        editPresetButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const preset = btn.dataset.preset;
                editTaskDue.value = getPresetDatetime(preset);
            });
        });

        // Event listener klik tombol list & tabel (Edit / Hapus)
        function handleTaskActionClick(event) {
            if (!(event.target instanceof Element)) return;

            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const taskId = button.dataset.id;
            const action = button.dataset.action;

            if (action === "edit") {
                openEditModal(taskId);
            } else if (action === "delete") {
                const task = tasks.find(item => item.id === taskId);
                const title = task ? `"${task.title}"` : "tugas ini";
                if (confirm(`Apakah kamu yakin ingin menghapus ${title}?`)) {
                    tasks = tasks.filter(item => item.id !== taskId);
                    saveTasks();
                    renderTasks();
                }
            }
        }

        taskList.addEventListener("click", handleTaskActionClick);
        tasksTableBody.addEventListener("click", handleTaskActionClick);

        // Simpan Perubahan dari Modal Edit
        editForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const taskId = editTaskId.value;
            const trimmedTitle = editTaskTitle.value.trim();

            if (!trimmedTitle) {
                editTaskTitle.classList.add("is-invalid");
                if (editTitleError) editTitleError.hidden = false;
                editTaskTitle.focus();
                return;
            }

            const task = tasks.find(item => item.id === taskId);
            if (!task) return;

            let dueDateIso = null;
            if (editTaskDue.value) {
                const parsedDate = new Date(editTaskDue.value);
                if (!isNaN(parsedDate.getTime())) {
                    dueDateIso = parsedDate.toISOString();
                }
            }

            task.title = trimmedTitle;
            task.priority = editSelectedPriority;
            task.dueDate = dueDateIso;
            if (editTaskCompleted) {
                task.completed = editTaskCompleted.checked;
            }
            task.updatedAt = new Date().toISOString();

            saveTasks();
            renderTasks();
            editModal.close();
        });

        // Keyboard Shortcut: Ctrl + Enter / Cmd + Enter untuk simpan langsung
        editForm.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                editForm.requestSubmit();
            }
        });

        // Tombol Hapus Tugas dari dalam Modal Edit
        if (modalDeleteBtn) {
            modalDeleteBtn.addEventListener("click", () => {
                const taskId = editTaskId.value;
                const task = tasks.find(item => item.id === taskId);
                if (!task) return;

                const confirmation = confirm(`Apakah kamu yakin ingin menghapus tugas "${task.title}"?`);
                if (!confirmation) return;

                tasks = tasks.filter(item => item.id !== taskId);
                saveTasks();
                renderTasks();
                editModal.close();
            });
        }

        // Tombol Hapus Tenggat di Modal Edit
        editClearDueBtn.addEventListener("click", () => {
            editTaskDue.value = "";
        });

        // Tombol Tutup / Batal Modal Edit
        modalCancelBtn.addEventListener("click", () => editModal.close());
        modalCloseBtn.addEventListener("click", () => editModal.close());

        // Tutup modal secara aman saat klik backdrop (tanpa menutup jika drag/seleksi teks dari dalam form)
        let editModalMouseDownOnBackdrop = false;
        editModal.addEventListener("mousedown", (e) => {
            editModalMouseDownOnBackdrop = (e.target === editModal);
        });

        editModal.addEventListener("click", (e) => {
            if (e.target === editModal && editModalMouseDownOnBackdrop) {
                editModal.close();
            }
            editModalMouseDownOnBackdrop = false;
        });

        // =====================================
        // 12. FILTER TUGAS (TABS & SELECT)
        // =====================================
        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filterSelect.value = btn.dataset.filter;
                renderTasks();
            });
        });

        filterSelect.addEventListener("change", function() {
            filterButtons.forEach(b => {
                b.classList.toggle("active", b.dataset.filter === filterSelect.value);
            });
            renderTasks();
        });

        // =====================================
        // 13. HAPUS TUGAS YANG SELESAI
        // =====================================
        clearCompletedButton.addEventListener("click", function() {
            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            renderTasks();
        });

        // =====================================
        // 14. HAPUS SEMUA TUGAS
        // =====================================
        clearAllButton.addEventListener("click", function() {
            const confirmation = confirm("Apakah kamu yakin ingin menghapus semua tugas?");
            if (!confirmation) return;

            tasks = [];
            saveTasks();
            renderTasks();
        });

        // =====================================
        // [GARIS PEMBERITAHU: ENGINE KALENDER & AGENDA HARIAN (VANILLA JS)]
        // Implementasi kalender penuh murni tanpa library pihak ketiga (seperti FullCalendar / Moment.js):
        // - Perhitungan matriks tanggal, hari libur/bulan lalu & berikutnya
        // - Indikator dot titik tugas aktif pada masing-masing tanggal
        // - Fitur klik tanggal interaktif untuk membuka daftar agenda tugas pada hari tersebut
        // =====================================
        // 15. LOGIKA KALENDER & AGENDA
        // =====================================

        // Helper: attach drag-drop target handlers to a calendar day cell
        function attachCalendarCellDropHandlers(cell) {
            cell.addEventListener("dragover", (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                cell.classList.add("drag-over");
            });
            cell.addEventListener("dragleave", () => {
                cell.classList.remove("drag-over");
            });
            cell.addEventListener("drop", (e) => {
                e.preventDefault();
                cell.classList.remove("drag-over");
                const taskId = e.dataTransfer.getData("text/plain");
                const targetDateKey = cell.dataset.date;
                if (!taskId || !targetDateKey) return;
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                // Build new dueDate at the same time-of-day, on the dropped date
                const parts = targetDateKey.split("-");
                const y = parseInt(parts[0]), m = parseInt(parts[1]) - 1, d = parseInt(parts[2]);
                if (task.dueDate) {
                    const oldDue = new Date(task.dueDate);
                    const newDue = new Date(y, m, d, oldDue.getHours(), oldDue.getMinutes(), oldDue.getSeconds());
                    task.dueDate = newDue.toISOString();
                } else {
                    // Task had no dueDate — assign one (noon on the target date)
                    const newDue = new Date(y, m, d, 12, 0, 0);
                    task.dueDate = newDue.toISOString();
                }
                task.updatedAt = new Date().toISOString();
                calSelectedDateKey = targetDateKey;
                saveTasks();
                renderTasks();
            });
        }

        function renderCalendar() {
            if (!calendarDaysGrid || !calendarMonthYear) return;

            const monthNames = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];

            calendarMonthYear.innerHTML = `<span class="cal-month-name">${monthNames[calCurrentMonth]}</span><span class="cal-year-num">${calCurrentYear}</span>`;
            calendarDaysGrid.replaceChildren();

            const today = new Date();
            const todayKey = getDateKey(today);

            // Hari pertama bulan ini (0 = Senin, 6 = Minggu)
            const firstDayIndex = (new Date(calCurrentYear, calCurrentMonth, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(calCurrentYear, calCurrentMonth, 0).getDate();

            // 1. Hari-hari bulan sebelumnya (interaktif)
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const prevDay = daysInPrevMonth - i;
                const cell = document.createElement("button");
                cell.type = "button";
                cell.className = "cal-day-cell other-month";
                const prevDate = new Date(calCurrentYear, calCurrentMonth - 1, prevDay);
                const prevKey = getDateKey(prevDate);
                cell.dataset.date = prevKey;
                cell.setAttribute("title", `Pindah ke ${prevDay} bulan sebelumnya`);
                cell.innerHTML = `<span>${prevDay}</span>`;

                cell.addEventListener("click", () => {
                    calCurrentMonth--;
                    if (calCurrentMonth < 0) {
                        calCurrentMonth = 11;
                        calCurrentYear--;
                    }
                    calSelectedDateKey = prevKey;
                    renderCalendar();
                });

                attachCalendarCellDropHandlers(cell);
                calendarDaysGrid.appendChild(cell);
            }

            // 2. Hari-hari bulan berjalan
            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(calCurrentYear, calCurrentMonth, day);
                const dateKey = getDateKey(cellDate);
                const dayTasks = getTasksForDate(dateKey);

                const cell = document.createElement("button");
                cell.type = "button";
                cell.className = "cal-day-cell";
                cell.dataset.date = dateKey;

                if (dateKey === todayKey) {
                    cell.classList.add("is-today");
                }
                if (dateKey === calSelectedDateKey) {
                    cell.classList.add("is-selected");
                }

                const dayNum = document.createElement("span");
                dayNum.textContent = day;
                cell.appendChild(dayNum);

                // Indikator tugas
                const dotsContainer = document.createElement("div");
                dotsContainer.className = "cal-day-dots";

                if (dayTasks.length > 0) {
                    const uncompleted = dayTasks.filter(t => !t.completed);
                    const dot = document.createElement("span");
                    dot.className = "cal-dot";

                    if (uncompleted.length === 0) {
                        dot.classList.add("all-done");
                    } else if (uncompleted.some(t => t.priority === "high")) {
                        dot.classList.add("p-high");
                    } else if (uncompleted.some(t => t.priority === "medium")) {
                        dot.classList.add("p-medium");
                    } else {
                        dot.classList.add("p-low");
                    }
                    dotsContainer.appendChild(dot);
                }

                cell.appendChild(dotsContainer);

                cell.addEventListener("click", () => {
                    calSelectedDateKey = dateKey;
                    renderCalendar();
                });

                attachCalendarCellDropHandlers(cell);
                calendarDaysGrid.appendChild(cell);
            }

            // 3. Hari-hari bulan berikutnya penutup grid (interaktif)
            const totalCellsSoFar = firstDayIndex + daysInMonth;
            const nextDaysNeeded = (7 - (totalCellsSoFar % 7)) % 7;
            for (let nextDay = 1; nextDay <= nextDaysNeeded; nextDay++) {
                const cell = document.createElement("button");
                cell.type = "button";
                cell.className = "cal-day-cell other-month";
                const nextDate = new Date(calCurrentYear, calCurrentMonth + 1, nextDay);
                const nextKey = getDateKey(nextDate);
                cell.dataset.date = nextKey;
                cell.setAttribute("title", `Pindah ke ${nextDay} bulan berikutnya`);
                cell.innerHTML = `<span>${nextDay}</span>`;

                cell.addEventListener("click", () => {
                    calCurrentMonth++;
                    if (calCurrentMonth > 11) {
                        calCurrentMonth = 0;
                        calCurrentYear++;
                    }
                    calSelectedDateKey = nextKey;
                    renderCalendar();
                });

                attachCalendarCellDropHandlers(cell);
                calendarDaysGrid.appendChild(cell);
            }

            // 4. Render Agenda
            renderAgenda();
        }

        function renderAgenda() {
            if (!agendaTaskList || !agendaDateTitle || !agendaCountBadge) return;

            agendaTaskList.replaceChildren();

            const dateParts = calSelectedDateKey.split("-");
            const dateObj = new Date(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
            const dateStr = dateObj.toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "short",
                year: "numeric"
            });

            agendaDateTitle.textContent = dateStr;

            const selectedTasks = getTasksForDate(calSelectedDateKey);
            agendaCountBadge.textContent = `${selectedTasks.length} tugas`;
            agendaEmptyState.hidden = selectedTasks.length > 0;

            selectedTasks.forEach(task => {
                const li = document.createElement("li");
                li.className = "agenda-item" + (task.completed ? " is-completed" : "");
                li.dataset.id = task.id;

                // Make agenda items draggable to calendar dates
                li.draggable = true;
                li.addEventListener("dragstart", (e) => {
                    e.dataTransfer.setData("text/plain", task.id);
                    e.dataTransfer.effectAllowed = "move";
                    li.classList.add("is-dragging");
                });
                li.addEventListener("dragend", () => {
                    li.classList.remove("is-dragging");
                    // Clean up any leftover drag-over highlights
                    document.querySelectorAll(".cal-day-cell.drag-over").forEach(c => c.classList.remove("drag-over"));
                });

                // Drag handle icon
                const dragHandle = document.createElement("span");
                dragHandle.className = "agenda-drag-handle";
                dragHandle.innerHTML = `<span class="material-symbols-outlined">drag_indicator</span>`;
                dragHandle.setAttribute("title", "Seret ke tanggal lain di kalender");

                // Checkbox & Judul
                const leftDiv = document.createElement("label");
                leftDiv.className = "agenda-item-left";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.dataset.action = "agenda-toggle";
                checkbox.dataset.id = task.id;
                checkbox.setAttribute("aria-label", "Tandai tugas " + task.title);

                const titleSpan = document.createElement("span");
                titleSpan.className = "agenda-title";
                titleSpan.textContent = task.title;
                titleSpan.title = "Klik dua kali untuk edit tugas";
                titleSpan.addEventListener("dblclick", (e) => {
                    e.preventDefault();
                    openEditModal(task.id);
                });

                leftDiv.append(checkbox, titleSpan);

                // Prioritas & Waktu
                const rightDiv = document.createElement("div");
                rightDiv.className = "agenda-item-right";

                const priorityBadge = document.createElement("span");
                priorityBadge.className = `priority-badge priority-${task.priority || "medium"}`;
                const priorityLabels = { high: "Tinggi", medium: "Sedang", low: "Rendah" };
                priorityBadge.innerHTML = `<span class="priority-dot"></span><span>${priorityLabels[task.priority] || "Sedang"}</span>`;
                rightDiv.appendChild(priorityBadge);

                if (task.dueDate) {
                    const dueObj = new Date(task.dueDate);
                    if (!isNaN(dueObj.getTime())) {
                        const timeStr = dueObj.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
                        const timeSpan = document.createElement("span");
                        timeSpan.className = "agenda-time";
                        timeSpan.innerHTML = `
                            <svg class="task-date-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
                            </svg>
                            <span>${timeStr}</span>
                        `;
                        rightDiv.appendChild(timeSpan);
                    }
                }

                // Tombol Aksi di Agenda (Edit & Hapus)
                const actionsWrapper = document.createElement("div");
                actionsWrapper.className = "agenda-actions";

                const editButton = document.createElement("button");
                editButton.className = "btn-action btn-edit";
                editButton.type = "button";
                editButton.dataset.action = "agenda-edit";
                editButton.dataset.id = task.id;
                editButton.setAttribute("aria-label", "Edit tugas");
                editButton.setAttribute("title", "Edit tugas (atau klik 2x judul)");
                editButton.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

                const deleteButton = document.createElement("button");
                deleteButton.className = "btn-action btn-delete";
                deleteButton.type = "button";
                deleteButton.dataset.action = "agenda-delete";
                deleteButton.dataset.id = task.id;
                deleteButton.setAttribute("aria-label", "Hapus tugas");
                deleteButton.setAttribute("title", "Hapus tugas");
                deleteButton.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

                actionsWrapper.append(editButton, deleteButton);
                rightDiv.appendChild(actionsWrapper);

                li.append(dragHandle, leftDiv, rightDiv);
                agendaTaskList.appendChild(li);
            });
        }

        // Navigasi Kalender
        calPrevBtn.addEventListener("click", () => {
            calCurrentMonth--;
            if (calCurrentMonth < 0) {
                calCurrentMonth = 11;
                calCurrentYear--;
            }
            renderCalendar();
        });

        calNextBtn.addEventListener("click", () => {
            calCurrentMonth++;
            if (calCurrentMonth > 11) {
                calCurrentMonth = 0;
                calCurrentYear++;
            }
            renderCalendar();
        });

        calTodayBtn.addEventListener("click", () => {
            const now = new Date();
            calCurrentYear = now.getFullYear();
            calCurrentMonth = now.getMonth();
            calSelectedDateKey = getDateKey(now);
            renderCalendar();
        });

        // Toggle selesai tugas dari kalender agenda
        agendaTaskList.addEventListener("change", (e) => {
            const checkbox = e.target;
            if (!(checkbox instanceof HTMLInputElement) || checkbox.dataset.action !== "agenda-toggle") return;
            const task = tasks.find(t => t.id === checkbox.dataset.id);
            if (!task) return;
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        // Klik tombol aksi (Edit / Hapus) di Agenda Kalender
        agendaTaskList.addEventListener("click", (e) => {
            if (!(e.target instanceof Element)) return;
            const button = e.target.closest("button[data-action]");
            if (!button) return;

            const taskId = button.dataset.id;
            const action = button.dataset.action;

            if (action === "agenda-edit") {
                openEditModal(taskId);
            } else if (action === "agenda-delete") {
                const task = tasks.find(item => item.id === taskId);
                const title = task ? `"${task.title}"` : "tugas ini";
                if (confirm(`Apakah kamu yakin ingin menghapus ${title}?`)) {
                    tasks = tasks.filter(item => item.id !== taskId);
                    saveTasks();
                    renderTasks();
                }
            }
        });

        // =====================================
        // 16. MENJALANKAN APLIKASI
        // =====================================
        loadTasks();
    </script>
</body>
</html>
