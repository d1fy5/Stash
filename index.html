<!--
  Stash — Minimalist Productivity & Agenda
  File Utama Frontend: Antarmuka HTML, CSS Styling & Desain Token Warna, serta JavaScript Interaktif.
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash — Minimalist Productivity & Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,200..300,0,0&display=swap">
    <style>
        /* =========================================================================
           1. DESIGN SYSTEM & TOKENS (UNIFIED MONOCHROME — VISUAL REF: c9c1099)
           ========================================================================= */
        :root {
            /* Warna Latar Belakang & Permukaan Kartu */
            --bg: #f8f9fa;
            --bg-subtle: #f1f3f5;
            --card-bg: #ffffff;
            --item-bg: #ffffff;
            --item-hover: #f8f9fa;
            --item-border: #eaedf0;

            /* Tipografi / Teks */
            --text-main: #111418;
            --text-secondary: #5c6874;
            --text-muted: #8b98a5;
            --text-subtle: #b0bac5;

            /* Garis Border */
            --border: #e6eaed;
            --border-hover: #cbd3da;
            --border-focus: #111418;

            /* Aksi Utama */
            --primary: #111418;
            --primary-fg: #ffffff;
            --primary-hover: #292e34;
            --ring: rgba(17, 20, 24, 0.12);

            /* Indikator Prioritas Fungsional */
            --p-high: #ef4444;
            --p-high-bg: rgba(239, 68, 68, 0.12);
            --p-high-text: #dc2626;
            --p-high-border: rgba(239, 68, 68, 0.25);

            --p-med: #eab308;
            --p-med-bg: rgba(234, 179, 8, 0.14);
            --p-med-text: #a16207;
            --p-med-border: rgba(234, 179, 8, 0.30);

            --p-low: #38bdf8;
            --p-low-bg: rgba(56, 189, 248, 0.12);
            --p-low-text: #0284c7;
            --p-low-border: rgba(56, 189, 248, 0.25);

            /* Radius & Shadows */
            --radius-xs: 5px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 3px 18px -2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            --shadow-modal: 0 20px 50px -10px rgba(0, 0, 0, 0.16);

            /* Transisi Halus */
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.14s var(--ease);
        }

        [data-theme="dark"] {
            --bg: #0b0c0e;
            --bg-subtle: #131518;
            --card-bg: #14161a;
            --item-bg: #17191e;
            --item-hover: #1e2128;
            --item-border: #23272f;

            --text-main: #f5f7f9;
            --text-secondary: #9aa6b2;
            --text-muted: #65717e;
            --text-subtle: #454e58;

            --border: #23272f;
            --border-hover: #373d49;
            --border-focus: #f5f7f9;

            --primary: #f5f7f9;
            --primary-fg: #0b0c0e;
            --primary-hover: #e2e6eb;
            --ring: rgba(245, 247, 249, 0.15);

            --p-high: #f87171;
            --p-high-bg: rgba(248, 113, 113, 0.16);
            --p-high-text: #fca5a5;
            --p-high-border: rgba(248, 113, 113, 0.30);

            --p-med: #fde047;
            --p-med-bg: rgba(253, 224, 71, 0.16);
            --p-med-text: #fef08a;
            --p-med-border: rgba(253, 224, 71, 0.30);

            --p-low: #38bdf8;
            --p-low-bg: rgba(56, 189, 248, 0.16);
            --p-low-text: #7dd3fc;
            --p-low-border: rgba(56, 189, 248, 0.30);

            --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.45), 0 0 1px rgba(255, 255, 255, 0.04);
            --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.75);
        }

        /* =========================================================================
           2. BASE RESET & TYPOGRAPHY SYSTEM (EXACT INHERITANCE)
           ========================================================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13.5px;
            line-height: 1.5;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        button, input, select, textarea {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: inherit;
            line-height: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            transition: all var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible, input:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--ring);
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.35;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 18px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
        }

        /* =========================================================================
           3. UNIFIED 2-COLUMN DASHBOARD LAYOUT (PRESERVED)
           ========================================================================= */
        .app-layout {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 20px;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            gap: 18px;
            align-items: start;
        }

        .container {
            width: 100%;
            min-width: 0;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .container:hover {
            border-color: var(--border-hover);
        }

        .calendar-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 721px) {
            .calendar-card {
                position: sticky;
                top: 24px;
            }
        }

        /* =========================================================================
           4. UNIFIED CARD HEADERS (MATCHED 1:1)
           ========================================================================= */
        .section-header, .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            position: relative;
            min-height: 32px;
        }

        .header-title-group, .calendar-title-group {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .section-title, .calendar-month-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin: 0;
            line-height: 1.2;
        }

        .cal-month-name, .brand-name {
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: var(--text-main);
        }

        .cal-year-num, .brand-count {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .header-nav-group, .calendar-nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-progress-line {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: transparent;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.35s var(--ease);
        }

        .cal-nav-btn, .theme-toggle {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: var(--radius-xs);
            height: 29px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            padding: 0;
        }

        .cal-nav-btn.text-btn {
            padding: 0 9px;
            font-size: 11.5px;
            font-weight: 600;
            line-height: 1;
        }

        .cal-nav-btn.icon-btn, .theme-toggle {
            width: 29px;
        }

        .cal-nav-btn:hover, .theme-toggle:hover {
            color: var(--text-main);
            border-color: var(--border-hover);
            background: var(--item-hover);
        }

        /* =========================================================================
           5. TASK INPUT FORM & MORPHING PLUS BUTTON
           ========================================================================= */
        .task-form-minimal {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .input-bar-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 3px 5px 3px 12px;
            gap: 6px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), padding-right 0.28s var(--ease);
            position: relative;
            height: 38px;
            min-height: 38px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .task-form-minimal.is-expanded .input-bar-wrapper {
            padding-right: 38px;
            cursor: default;
        }

        .input-bar-wrapper:focus-within {
            border-color: var(--border-focus);
            background: var(--card-bg);
            box-shadow: 0 0 0 2px var(--ring);
        }

        .task-input-clean {
            flex: 1;
            min-width: 0;
            height: 32px;
            line-height: 32px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main);
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s var(--ease);
        }

        .task-form-minimal.is-expanded .task-input-clean {
            opacity: 1;
            pointer-events: auto;
        }

        .task-input-clean::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-inline-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s var(--ease);
        }

        .task-form-minimal.is-expanded .input-inline-tools {
            opacity: 1;
            pointer-events: auto;
        }

        .priority-mini-group {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--bg-subtle);
            border: none;
            border-radius: var(--radius-xs);
            padding: 2px;
            height: 26px;
        }

        .mini-pill {
            height: 20px;
            padding: 0 7px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            color: var(--text-muted);
            background: transparent;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .mini-pill:hover {
            color: var(--text-main);
        }

        .mini-pill[data-priority="low"]:hover:not(.active) {
            color: var(--p-low-text);
            background: var(--p-low-bg);
        }

        .mini-pill[data-priority="medium"]:hover:not(.active) {
            color: var(--p-med-text);
            background: var(--p-med-bg);
        }

        .mini-pill[data-priority="high"]:hover:not(.active) {
            color: var(--p-high-text);
            background: var(--p-high-bg);
        }

        .mini-pill.active {
            background: var(--primary);
            color: var(--primary-fg);
            border: none;
        }

        .mini-pill.active[data-priority="low"] {
            background: var(--p-low-bg);
            color: var(--p-low-text);
            border: none;
        }

        .mini-pill.active[data-priority="medium"] {
            background: var(--p-med-bg);
            color: var(--p-med-text);
            border: none;
        }

        .mini-pill.active[data-priority="high"] {
            background: var(--p-high-bg);
            color: var(--p-high-text);
            border: none;
        }

        .due-mini-label {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-xs);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .due-mini-label:hover {
            color: var(--text-main);
            background: var(--bg-subtle);
        }

        .due-mini-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            cursor: pointer;
        }

        .due-mini-icon {
            font-size: 15px;
            pointer-events: none;
        }

        /* Morphing Plus Button */
        .btn-add-clean {
            position: absolute;
            top: 4px;
            right: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            border-radius: var(--radius-xs);
            background: var(--primary);
            color: var(--primary-fg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            z-index: 5;
            border: none;
            padding: 0 12px;
            transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        top 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        right 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.25s var(--ease),
                        background-color 0.15s ease,
                        transform 0.15s ease;
        }

        .btn-add-clean:hover {
            background: var(--primary-hover);
        }

        .btn-add-icon {
            flex-shrink: 0;
            transition: transform 0.25s var(--ease);
        }

        .btn-add-text {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.15s ease;
            pointer-events: none;
        }

        /* When Expanded: Morph into small button on the right */
        .task-form-minimal.is-expanded .btn-add-clean {
            top: 5px;
            right: 5px;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: var(--radius-xs);
        }

        .task-form-minimal.is-expanded .btn-add-clean:hover {
            transform: scale(1.05);
        }

        .task-form-minimal.is-expanded .btn-add-text {
            opacity: 0;
            display: none;
        }

        /* =========================================================================
           6. COMPACT MINIMALIST TOOLBAR
           ========================================================================= */
        .tasks-compact-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .filter-tabs-clean {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 2px;
            flex-shrink: 0;
        }

        .filter-btn {
            background: transparent;
            border: none;
            height: 24px;
            padding: 0 9px;
            border-radius: 4px;
            font-size: 11.5px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .toolbar-right-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .search-mini-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-mini-input {
            width: 110px;
            height: 26px;
            line-height: 26px;
            padding: 0 20px 0 24px;
            font-size: 11.5px;
            font-weight: 400;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            color: var(--text-main);
            outline: none;
            transition: all var(--transition-fast);
        }

        .search-mini-input:focus {
            width: 135px;
            border-color: var(--border-focus);
            background: var(--card-bg);
        }

        .search-mini-icon {
            position: absolute;
            left: 6px;
            font-size: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-clear-mini {
            position: absolute;
            right: 5px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-switcher-clean {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 2px;
            flex-shrink: 0;
        }

        .view-btn {
            width: 24px;
            height: 22px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
        }

        .view-btn:hover {
            color: var(--text-main);
        }

        .view-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* =========================================================================
           7. TASK LIST & TABLE VIEW
           ========================================================================= */
        .task-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: min(440px, calc(100vh - 280px));
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: var(--radius-sm);
            font-size: 12.8px;
            line-height: 1.4;
            gap: 10px;
            transition: all var(--transition-fast);
            position: relative;
            user-select: none;
        }

        .task-item:hover {
            background: var(--item-hover);
            border-color: var(--border-hover);
        }

        .task-item.is-completed {
            opacity: 0.5;
        }

        .task-item.is-completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-item.is-dragging {
            opacity: 0.3;
            border-style: dashed;
        }

        .task-item.drag-over-top {
            border-top: 2px solid var(--primary);
        }

        .task-item.drag-over-bottom {
            border-bottom: 2px solid var(--primary);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 9px;
            flex: 1;
            min-width: 0;
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.25;
            transition: opacity var(--transition-fast);
            padding: 1px;
            flex-shrink: 0;
        }

        .task-item:hover .drag-handle {
            opacity: 0.75;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .task-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            border: 1.5px solid var(--border-hover);
            border-radius: 5px;
            background: var(--card-bg);
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: var(--primary);
        }

        .task-checkbox:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .task-checkbox:checked::before {
            content: "";
            width: 4px;
            height: 8px;
            border: solid var(--primary-fg);
            border-width: 0 1.6px 1.6px 0;
            transform: rotate(45deg) translate(-0.5px, -1px);
        }

        .task-text {
            font-size: 12.8px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .task-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .priority-dot-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p-med);
            flex-shrink: 0;
            border: none;
            box-shadow: none;
            transition: transform var(--transition-fast);
        }

        .priority-dot-indicator.p-high { background: var(--p-high); }
        .priority-dot-indicator.p-medium, .priority-dot-indicator.p-med { background: var(--p-med); }
        .priority-dot-indicator.p-low { background: var(--p-low); }

        .priority-pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            padding: 2px 8px;
            border-radius: 999px;
            border: none;
        }

        .priority-pill-badge.p-high {
            background: var(--p-high-bg);
            color: var(--p-high-text);
        }

        .priority-pill-badge.p-medium, .priority-pill-badge.p-med {
            background: var(--p-med-bg);
            color: var(--p-med-text);
        }

        .priority-pill-badge.p-low {
            background: var(--p-low-bg);
            color: var(--p-low-text);
        }

        .task-due-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.3;
        }

        .task-due-text.is-overdue {
            color: #d32f2f;
            font-weight: 600;
        }

        .task-due-text.is-due-soon {
            color: #d97706;
            font-weight: 600;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0.35;
            transition: opacity var(--transition-fast);
        }

        .task-item:hover .task-actions,
        .tasks-table tr:hover .task-actions {
            opacity: 1;
        }

        .btn-action {
            width: 25px;
            height: 25px;
            border-radius: var(--radius-xs);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
            line-height: 1;
        }

        .btn-action:hover {
            color: var(--text-main);
            background: var(--bg);
        }

        .btn-action.btn-delete:hover {
            color: #e53e3e;
            background: rgba(229, 62, 62, 0.08);
        }

        .tasks-table-wrapper {
            width: 100%;
            max-height: min(440px, calc(100vh - 280px));
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .tasks-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            line-height: 1.4;
            text-align: left;
        }

        .tasks-table th {
            background: var(--bg);
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .tasks-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        .tasks-table tr:last-child td {
            border-bottom: none;
        }

        .tasks-table tr:hover {
            background: var(--item-hover);
        }

        .tasks-table tr.is-completed td {
            opacity: 0.5;
        }

        .tasks-table tr.is-completed .tasks-table-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .tasks-table-title {
            font-weight: 500;
            cursor: pointer;
        }

        /* =========================================================================
           8. EMPTY STATE & FOOTER
           ========================================================================= */
        .empty-state {
            padding: 28px 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 400;
            margin: 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .task-summary {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin: 0;
            line-height: 1.4;
        }

        .footer-actions {
            display: flex;
            gap: 6px;
        }

        .btn-footer {
            font-size: 11.5px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-secondary);
            background: var(--bg-subtle);
            border: none;
            padding: 4px 10px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .btn-footer:hover:not(:disabled) {
            color: var(--text-main);
            background: var(--item-hover);
        }

        .btn-footer.danger:hover:not(:disabled) {
            color: #e53e3e;
            background: rgba(229, 62, 62, 0.08);
        }

        .storage-notice {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
            width: 100%;
            text-align: right;
            min-height: 14px;
            margin: 0;
        }

        /* =========================================================================
           9. PERFECT SQUARE CALENDAR & AGENDA
           ========================================================================= */
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-bottom: 2px;
        }

        .calendar-days-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
        }

        /* Perfect Square Calendar Day Cells (1:1 Aspect Ratio) */
        .cal-day-cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            min-width: 0;
            min-height: 0;
            height: auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
            padding: 0;
            line-height: 1;
            transition: all var(--transition-fast);
        }

        .cal-day-cell > span {
            line-height: 1;
            pointer-events: none;
        }

        .cal-day-cell:hover:not(.is-selected) {
            background: var(--item-hover);
            border-color: var(--border-hover);
        }

        .cal-day-cell.other-month {
            opacity: 0.3;
            color: var(--text-muted);
        }

        .cal-day-cell.is-today {
            border-color: var(--primary);
            font-weight: 700;
        }

        .cal-day-cell.is-today::after {
            content: "";
            position: absolute;
            top: 4px;
            right: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--primary);
        }

        .cal-day-cell.is-selected {
            background: var(--primary);
            color: var(--primary-fg);
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .cal-day-cell.drag-over {
            background: var(--primary) !important;
            color: var(--primary-fg) !important;
            transform: scale(1.08);
            z-index: 5;
            box-shadow: 0 0 0 2px var(--primary-fg);
        }

        .cal-day-dots {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            display: flex;
            gap: 2.5px;
            align-items: center;
            justify-content: center;
            height: 4px;
            pointer-events: none;
        }

        .cal-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--p-med);
            border: none;
            box-shadow: none;
            transition: all var(--transition-fast);
        }

        .cal-day-cell.is-selected .cal-dot {
            background: var(--primary-fg);
            box-shadow: none;
        }

        .cal-dot.p-high { background: var(--p-high); }
        .cal-dot.p-medium, .cal-dot.p-med { background: var(--p-med); }
        .cal-dot.p-low { background: var(--p-low); }

        .calendar-agenda {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .agenda-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agenda-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            line-height: 1.3;
        }

        .agenda-count {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--bg-subtle);
            border: none;
            color: var(--text-secondary);
        }

        .agenda-task-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 180px;
            overflow-y: auto;
        }

        .agenda-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: var(--radius-sm);
            font-size: 12.8px;
            line-height: 1.4;
            gap: 10px;
            transition: all var(--transition-fast);
        }

        .agenda-item:hover {
            background: var(--item-hover);
            border-color: var(--border-hover);
        }

        .agenda-item.is-completed {
            opacity: 0.5;
        }

        .agenda-item.is-completed .agenda-title {
            text-decoration: line-through;
        }

        .agenda-item-left {
            display: flex;
            align-items: center;
            gap: 9px;
            flex: 1;
            min-width: 0;
        }

        .agenda-title {
            font-size: 12.8px;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .agenda-item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .agenda-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1;
        }

        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .agenda-empty {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            text-align: center;
            padding: 14px 8px;
            margin: 0;
        }

        /* =========================================================================
           10. EDIT MODAL DIALOG & TOAST NOTIFICATIONS
           ========================================================================= */
        .modal {
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal[open] {
            opacity: 1;
            pointer-events: auto;
        }

        .modal::backdrop {
            background: rgba(0, 0, 0, 0.45);
        }

        [data-theme="dark"] .modal::backdrop {
            background: rgba(0, 0, 0, 0.75);
        }

        .modal-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-modal);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            line-height: 1.2;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-main);
            background: var(--bg-subtle);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modal-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .modal-char-counter {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .modal-input {
            width: 100%;
            height: 38px;
            line-height: 38px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--border-focus);
            background: var(--card-bg);
            box-shadow: 0 0 0 2px var(--ring);
        }

        .modal-due-row {
            display: flex;
            gap: 8px;
        }

        .modal-due-input {
            flex: 1;
            height: 36px;
            line-height: 36px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 10px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-main);
        }

        .btn-clear-due {
            padding: 0 12px;
            background: var(--bg-subtle);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-clear-due:hover {
            color: var(--text-main);
        }

        .modal-due-presets {
            display: flex;
            gap: 5px;
            margin-top: 3px;
        }

        .btn-preset {
            flex: 1;
            padding: 5px 6px;
            background: var(--bg-subtle);
            border: none;
            border-radius: var(--radius-xs);
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-preset:hover {
            color: var(--text-main);
            background: var(--item-hover);
        }

        .modal-checkbox-label {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-secondary);
        }

        .modal-meta-info {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
            padding: 7px 10px;
            background: var(--bg-subtle);
            border-radius: var(--radius-xs);
            border: none;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .modal-actions-right {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            height: 34px;
            padding: 0 14px;
            background: var(--bg-subtle);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary:hover {
            color: var(--text-main);
            background: var(--item-hover);
        }

        .btn-primary {
            height: 34px;
            padding: 0 16px;
            background: var(--primary);
            color: var(--primary-fg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-danger-text {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .btn-danger-text:hover {
            color: #e53e3e;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }

        .toast-capsule {
            pointer-events: auto;
            background: var(--primary);
            color: var(--primary-fg);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-modal);
        }

        .toast-undo-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--primary-fg);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }

        [data-theme="dark"] .toast-undo-btn {
            background: rgba(0, 0, 0, 0.25);
        }

        /* =========================================================================
           11. RESPONSIVE MEDIA QUERIES (SQUARE CALENDAR CELLS PRESERVED)
           ========================================================================= */
        @media (max-width: 900px) and (min-width: 721px) {
            .app-layout {
                max-width: 100%;
                padding: 18px 14px;
                gap: 12px;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }

            .container {
                padding: 18px 14px;
                gap: 14px;
            }

            .tasks-compact-toolbar {
                gap: 4px;
            }

            .filter-btn {
                padding: 0 7px;
                font-size: 11px;
            }

            .search-mini-input {
                width: 95px;
            }

            .search-mini-input:focus {
                width: 120px;
            }
        }

        @media (max-width: 720px) {
            .app-layout {
                grid-template-columns: minmax(0, 1fr);
                max-width: 520px;
                padding: 14px 12px 28px;
                gap: 14px;
            }

            .container {
                padding: 18px 14px;
                gap: 14px;
            }

            .calendar-card {
                position: static;
            }

            .tasks-compact-toolbar {
                flex-wrap: wrap;
                gap: 8px;
            }

            .toolbar-right-tools {
                margin-left: auto;
            }

            .search-mini-input {
                width: 120px;
            }
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    
    <!-- Notifikasi Pop-up Toast -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <div class="app-layout">
        
        <!-- KARTU KIRI: Dashboard Pengelola Tugas -->
        <main class="container">
            
            <!-- Header: Judul Aplikasi, Penghitung Tugas, Progress Bar & Tombol Ganti Tema -->
            <header class="section-header">
                <div class="header-title-group">
                    <h1 class="section-title">
                        <span class="brand-name">STASH</span>
                        <span id="header-task-count" class="brand-count">0 TUGAS</span>
                    </h1>
                </div>
                <div class="header-nav-group">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle tema gelap/terang" title="Ganti Tema">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                </div>
                
                <div class="header-progress-line">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </header>

            
            <!-- Form Tambah Tugas Baru -->
            <form id="task-form" class="task-form-minimal">
                <div class="input-bar-wrapper">
                    <input
                        type="text"
                        id="task-input"
                        class="task-input-clean"
                        placeholder="Tulis tugas baru..."
                        maxlength="100"
                        required
                        autocomplete="off"
                    >
                    <div class="input-inline-tools">
                        <div class="priority-mini-group" id="add-priority-group" aria-label="Pilih prioritas">
                            <button type="button" class="mini-pill" data-priority="low" title="Prioritas Rendah">R</button>
                            <button type="button" class="mini-pill active" data-priority="medium" title="Prioritas Sedang">S</button>
                            <button type="button" class="mini-pill" data-priority="high" title="Prioritas Tinggi">T</button>
                        </div>

    <script type="module">
        import { openStashDB, dbRequest, saveAllTasks } from "./database.js";
        /**
         * Logika JavaScript Frontend:
         * Mengelola state aplikasi, penyimpanan IndexedDB, interaksi tema,
         * render daftar tugas, kalender interaktif, drag & drop, serta shortcut keyboard.
         */
        
        let cachedPreferences = {};
        function savePreference(key, value) {
            cachedPreferences[key] = value;
            return dbRequest("settings", "readwrite", store => store.put({
                id: "global", preferences: { ...cachedPreferences }, updatedAt: new Date().toISOString()
            })).catch(error => {
                console.error("Gagal menyimpan pengaturan lokal:", error);
                storageNotice.textContent = "Pengaturan gagal disimpan";
            });
        }

        async function loadPreferences() {
            const record = await dbRequest("settings", "readonly", store => store.get("global"));
            if (!record || !record.preferences) return {};
            const prefs = record.preferences;
            cachedPreferences = { ...prefs };
            if (prefs.theme) applyTheme(prefs.theme === "dark", false);
            if (prefs.view && ["list", "table"].includes(prefs.view)) {
                currentView = prefs.view;
                viewButtons.forEach(button => button.classList.toggle("active", button.dataset.view === currentView));
            }
            return prefs;
        }

        const taskForm = document.getElementById("task-form");
        const taskInput = document.getElementById("task-input");
        const btnAddTask = document.getElementById("btn-add-task");

        function expandTaskForm() {
            if (taskForm.classList.contains("is-expanded")) return;
            taskForm.classList.add("is-expanded");
            btnAddTask.type = "submit";
            setTimeout(() => {
                taskInput.focus();
            }, 60);
        }

        function collapseTaskForm(force = false) {
            if (!force && taskInput.value.trim() !== "") return;
            taskForm.classList.remove("is-expanded");
            btnAddTask.type = "button";
            taskInput.blur();
        }

        btnAddTask.addEventListener("click", (e) => {
            if (!taskForm.classList.contains("is-expanded")) {
                e.preventDefault();
                e.stopPropagation();
                expandTaskForm();
            }
        });

        const inputBarWrapper = taskForm.querySelector(".input-bar-wrapper");
        inputBarWrapper.addEventListener("click", (e) => {
            if (!taskForm.classList.contains("is-expanded")) {
                expandTaskForm();
            }
        });

        document.addEventListener("click", (e) => {
            if (taskForm.classList.contains("is-expanded") && !taskForm.contains(e.target)) {
                collapseTaskForm();
            }
        });
        const taskDueInput = document.getElementById("task-due-input");
        const taskList = document.getElementById("task-list");
        const tasksTableWrapper = document.getElementById("tasks-table-wrapper");
        const tasksTableBody = document.getElementById("tasks-table-body");
        const taskSummary = document.getElementById("task-summary");
        const filterSelect = document.getElementById("filter-select");
        const emptyState = document.getElementById("empty-state");
        const clearCompletedButton = document.getElementById("clear-completed");
        const clearAllButton = document.getElementById("clear-all");
        const storageNotice = document.getElementById("storage-notice");
        const themeToggle = document.getElementById("theme-toggle");
        const filterButtons = document.querySelectorAll(".filter-btn");
        const viewButtons = document.querySelectorAll(".view-btn");
        const headerTaskCount = document.getElementById("header-task-count");
        const progressBarFill = document.getElementById("progress-bar-fill");

        
        const taskSearchInput = document.getElementById("task-search-input");
        const searchClearBtn = document.getElementById("search-clear-btn");

        
        const toastContainer = document.getElementById("toast-container");

        
        const editModal = document.getElementById("edit-modal");
        const editForm = document.getElementById("edit-form");
        const editTaskId = document.getElementById("edit-task-id");
        const editTaskTitle = document.getElementById("edit-task-title");
        const editTaskDue = document.getElementById("edit-task-due");
        const editClearDueBtn = document.getElementById("edit-clear-due-btn");
        const modalCancelBtn = document.getElementById("modal-cancel-btn");
        const modalCloseBtn = document.getElementById("modal-close-btn");
        const modalDeleteBtn = document.getElementById("modal-delete-btn");
        const editCharCounter = document.getElementById("edit-char-counter");
        const editTitleError = document.getElementById("edit-title-error");
        const editTaskCompleted = document.getElementById("edit-task-completed");
        const editMetaInfo = document.getElementById("edit-meta-info");
        const editPresetButtons = document.querySelectorAll(".modal-due-presets .btn-preset");
        const addPriorityButtons = document.querySelectorAll("#add-priority-group .mini-pill");
        const editPriorityButtons = document.querySelectorAll("#edit-priority-group .mini-pill");

        
        const calendarMonthYear = document.getElementById("calendar-month-year");
        const calendarDaysGrid = document.getElementById("calendar-days-grid");
        const calTodayBtn = document.getElementById("cal-today-btn");
        const calPrevBtn = document.getElementById("cal-prev-btn");
        const calNextBtn = document.getElementById("cal-next-btn");
        const agendaDateTitle = document.getElementById("agenda-date-title");
        const agendaCountBadge = document.getElementById("agenda-count-badge");
        const agendaTaskList = document.getElementById("agenda-task-list");
        const agendaEmptyState = document.getElementById("agenda-empty-state");

        
        // State utama aplikasi
        let tasks = [];
        let currentView = "list";
        let addSelectedPriority = "medium";
        let editSelectedPriority = "medium";
        let searchQuery = "";
        let lastDeletedTask = null;
        let lastDeletedIndex = -1;
        let undoTimeout = null;

        
        let calCurrentYear = new Date().getFullYear();
        let calCurrentMonth = new Date().getMonth();
        let calSelectedDateKey = null;

        
        const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
        const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

        // Inisialisasi tema (terang/gelap) saat halaman pertama kali dimuat
        function initTheme() {
            const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(systemPrefersDark, false);
        }

        // Mengubah atribut data-theme dan ikon tombol tema
        function applyTheme(isDark, persist = true) {
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
            themeToggle.innerHTML = isDark ? SUN_SVG : MOON_SVG;
            if (persist) savePreference("theme", isDark ? "dark" : "light");
        }

        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            applyTheme(!isDark);
        });

        
        // Membuat ID unik untuk setiap tugas baru
        function createId() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return window.crypto.randomUUID();
            }
            return Date.now().toString(36) + "-" + Math.random().toString(36).substring(2, 8);
        }

        function formatCreatedAt(isoString) {
            if (!isoString) return "";
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return "";
                return date.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
            } catch (_) { return ""; }
        }

        // Memformat tanggal tenggat waktu menjadi teks ramah pengguna
        function formatDueDate(isoString) {
            if (!isoString) return null;
            try {
                const due = new Date(isoString);
                if (isNaN(due.getTime())) return null;

                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const startOfDue = new Date(due.getFullYear(), due.getMonth(), due.getDate());
                const diffDays = Math.round((startOfDue - startOfToday) / (1000 * 60 * 60 * 24));
                const timeStr = due.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

                let label = "";
                let isOverdue = false;
                let isDueSoon = false;

                if (due.getTime() < now.getTime()) {
                    isOverdue = true;
                    if (diffDays === 0) label = `Terlewat (${timeStr})`;
                    else label = `${Math.abs(diffDays)}h lalu`;
                } else if (diffDays === 0) {
                    isDueSoon = true;
                    label = `Hari ini, ${timeStr}`;
                } else if (diffDays === 1) {
                    label = `Besok, ${timeStr}`;
                } else if (diffDays > 1 && diffDays <= 7) {
                    label = `${diffDays} hari lagi`;
                } else {
                    label = due.toLocaleDateString("id-ID", { day: "numeric", month: "short" });
                }

                return { label, isOverdue, isDueSoon };
            } catch (_) { return null; }
        }

        function toDatetimeLocalString(isoString) {
            if (!isoString) return "";
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return "";
            const pad = n => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function getPresetDatetime(preset) {
            const now = new Date();
            let target = new Date();
            if (preset === "today") target.setHours(18, 0, 0, 0);
            else if (preset === "tomorrow") { target.setDate(now.getDate() + 1); target.setHours(18, 0, 0, 0); }
            else if (preset === "next-week") { target.setDate(now.getDate() + 7); target.setHours(18, 0, 0, 0); }
            return toDatetimeLocalString(target.toISOString());
        }

        function getDateKey(d) {
            const pad = n => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function getTasksForDate(dateKey) {
            return tasks.filter(t => {
                if (!t.dueDate) return false;
                const d = new Date(t.dueDate);
                if (isNaN(d.getTime())) return false;
                return getDateKey(d) === dateKey;
            });
        }

        
        function normalizeTask(task) {
            return {
                ...task,
                id: String(task.id || createId()),
                title: String(task.title || ""),
                completed: Boolean(task.completed),
                createdAt: task.createdAt || new Date().toISOString(),
                updatedAt: task.updatedAt || null,
                priority: ["high", "medium", "low"].includes(task.priority) ? task.priority : "medium",
                dueDate: task.dueDate || null
            };
        }

        // Semua tugas dimuat dari satu daftar lokal di IndexedDB.
        async function loadTasks() {
            tasks = (await dbRequest("tasks", "readonly", store => store.getAll())).map(normalizeTask);
            renderTasks();
        }

        async function saveTasks() {
            tasks.forEach(task => { task.updatedAt = new Date().toISOString(); });
            try {
                await saveAllTasks(tasks);
                storageNotice.textContent = "";
            } catch (error) {
                console.error("Gagal menyimpan tugas lokal:", error);
                storageNotice.textContent = "Gagal menyimpan data lokal";
            }
        }

        // Menampilkan pesan notifikasi pop-up (toast) dengan tombol urungkan (undo)
        function showToast(message, allowUndo = false) {
            toastContainer.replaceChildren();
            const capsule = document.createElement("div");
            capsule.className = "toast-capsule";

            const msgSpan = document.createElement("span");
            msgSpan.textContent = message;
            capsule.appendChild(msgSpan);

            if (allowUndo && lastDeletedTask) {
                const undoBtn = document.createElement("button");
                undoBtn.className = "toast-undo-btn";
                undoBtn.textContent = "Urungkan";
                undoBtn.type = "button";
                undoBtn.onclick = () => {
                    if (lastDeletedTask) {
                        const insertIdx = (lastDeletedIndex >= 0 && lastDeletedIndex <= tasks.length) ? lastDeletedIndex : 0;
                        tasks.splice(insertIdx, 0, lastDeletedTask);
                        saveTasks();
                        renderTasks();
                        showToast(`"${lastDeletedTask.title}" dikembalikan`);
                        lastDeletedTask = null;
                        lastDeletedIndex = -1;
                    }
                };
                capsule.appendChild(undoBtn);
            }

            toastContainer.appendChild(capsule);

            clearTimeout(undoTimeout);
            undoTimeout = setTimeout(() => {
                capsule.style.opacity = "0";
                capsule.style.transform = "translateY(10px) scale(0.95)";
                capsule.style.transition = "all 0.2s ease";
                setTimeout(() => { if (capsule.parentElement) capsule.remove(); }, 220);
            }, 3800);
        }

        
        // Memperbarui angka tugas tersisa dan progress bar persentase
        function updateSummary() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;

            
            if (total === 0) {
                headerTaskCount.textContent = "0 TUGAS";
                progressBarFill.style.width = "0%";
            } else if (active === 0) {
                headerTaskCount.textContent = "SEMUA TUNTAS";
                progressBarFill.style.width = "100%";
            } else {
                const percent = Math.round((completed / total) * 100);
                headerTaskCount.textContent = `${active} TERSISA · ${percent}%`;
                progressBarFill.style.width = `${percent}%`;
            }

            
            taskSummary.textContent = `${active} tugas tersisa · ${completed} selesai`;
            clearCompletedButton.disabled = completed === 0;
            clearAllButton.disabled = total === 0;
        }

        // Merender kartu-kartu tugas ke layar berdasarkan filter & pencarian aktif
        function renderTasks() {
            taskList.replaceChildren();
            tasksTableBody.replaceChildren();

            const currentFilter = filterSelect.value;
            const query = searchQuery.trim().toLowerCase();

            const filteredTasks = tasks.filter(task => {
                if (currentFilter === "active" && task.completed) return false;
                if (currentFilter === "completed" && !task.completed) return false;

                if (query) {
                    const matchTitle = task.title.toLowerCase().includes(query);
                    const matchPriority = (task.priority || "").toLowerCase().includes(query);
                    if (!matchTitle && !matchPriority) return false;
                }
                return true;
            });

            const hasTasks = tasks.length > 0;
            const hasFiltered = filteredTasks.length > 0;

            emptyState.hidden = hasFiltered;
            if (!hasTasks) emptyState.textContent = "Tidak ada tugas. Tulis sesuatu di atas.";
            else if (!hasFiltered) emptyState.textContent = "Tidak ada tugas yang cocok.";

            if (currentView === "table") {
                taskList.hidden = true;
                tasksTableWrapper.hidden = !hasFiltered;

        let draggedId = null;

        function cleanDragStyles() {
            taskList.querySelectorAll(".task-item").forEach(item => {

            });

        // Mengatur ulang urutan tugas saat digeser (Drag and Drop)
        function reorderTask(fromId, toId, placeBefore) {
            if (!fromId || !toId || fromId === toId) return;

            const fromIndex = tasks.findIndex(t => t.id === fromId);
            if (fromIndex === -1) return;

            const [movedTask] = tasks.splice(fromIndex, 1);
            let toIndex = tasks.findIndex(t => t.id === toId);

            if (toIndex === -1) tasks.push(movedTask);
            else {
                if (!placeBefore) toIndex += 1;
                tasks.splice(toIndex, 0, movedTask);
            }

            saveTasks();
            renderTasks();
        }

        taskList.addEventListener("dragover", (e) => {
            e.preventDefault();
            const targetItem = e.target.closest(".task-item");
            if (!targetItem || !draggedId || targetItem.dataset.id === draggedId) return;

            const rect = targetItem.getBoundingClientRect();
            const isTop = e.clientY - rect.top < rect.height / 2;

            taskList.querySelectorAll(".task-item").forEach(item => {
                if (item !== targetItem) item.classList.remove("drag-over-top", "drag-over-bottom");
            });

            targetItem.classList.toggle("drag-over-top", isTop);
            targetItem.classList.toggle("drag-over-bottom", !isTop);
        });

        taskList.addEventListener("drop", (e) => {
            e.preventDefault();
            const targetItem = e.target.closest(".task-item");
            if (!targetItem || !draggedId || targetItem.dataset.id === draggedId) {
                cleanDragStyles();
                return;
            }

            const rect = targetItem.getBoundingClientRect();
            const isTop = e.clientY - rect.top < rect.height / 2;
            reorderTask(draggedId, targetItem.dataset.id, isTop);
            cleanDragStyles();
            draggedId = null;
        });

        taskList.addEventListener("dragleave", (e) => {
            if (!e.relatedTarget || !taskList.contains(e.relatedTarget)) {
                cleanDragStyles();
            }
        });

        
        // Event submit form untuk menambahkan tugas baru
        taskForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            let dueDateIso = null;
            if (taskDueInput.value) {
                const parsed = new Date(taskDueInput.value);
                if (!isNaN(parsed.getTime())) dueDateIso = parsed.toISOString();
            }

            const newTask = {
                id: createId(),
                title: title,
                completed: false,
                createdAt: new Date().toISOString(),
                priority: addSelectedPriority,
                dueDate: dueDateIso
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();

            taskInput.value = "";
            taskDueInput.value = "";
            addSelectedPriority = "medium";
            addPriorityButtons.forEach(b => b.classList.toggle("active", b.dataset.priority === "medium"));
            collapseTaskForm(true);
            showToast(`Tugas ditambahkan`);
        });

        function handleTaskToggle(event) {
            const checkbox = event.target;
            if (!(checkbox instanceof HTMLInputElement) || checkbox.dataset.action !== "toggle") return;

            const task = tasks.find(item => item.id === checkbox.dataset.id);
            if (!task) return;

            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();

            if (task.completed) {
                const allDone = tasks.length > 0 && tasks.every(t => t.completed);
                if (allDone) {
                    showToast("Semua tugas selesai!");
                } else {
                    showToast(`Selesai: "${task.title}"`);
                }
            }
        }

        tasksTableBody.addEventListener("change", handleTaskToggle);

        function handleTaskActionClick(event) {
            if (!(event.target instanceof Element)) return;
            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const taskId = button.dataset.id;
            const action = button.dataset.action;

            if (action === "edit") openEditModal(taskId);
            else if (action === "delete") {
                const idx = tasks.findIndex(item => item.id === taskId);
                if (idx !== -1) {
                    lastDeletedTask = tasks[idx];

                    const title = lastDeletedTask.title;
